<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PORTAL_TITLE}}</title>
<link rel="icon" type="{{FAVICON_MIME}}" href="/favicon.ico?v={{FAVICON_VERSION}}">
<style>
:root{
  --bg:#0d1220; --panel:#151c2e; --panel-2:#1c2740; --line:#26324d;
  --text:#e8edf7; --muted:#8b98b8; --accent:#5aa7ff;
  --ok:#38d39f; --warn:#f0b429; --bad:#f26d6d;
  /* RGB triples of the panel family so alpha variants (list surfaces and
     pills) can track the theme. Defaults equal the literal
     colors below; the wallpaper-derived theme overrides them at runtime
     (applyTheme() in the Appearance script). Clearing the theme variables
     restores the stock look exactly. */
  --panel-rgb:21,28,46; --panel-2-rgb:28,39,64;
  --header-a-rgb:20,27,45; --header-b-rgb:16,22,38;
  --head-rgb:24,34,58; --hover-rgb:27,39,69;
  --selftag-line:#2e4a75;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgb(var(--header-a-rgb)),rgb(var(--header-b-rgb)));min-height:52px;flex-wrap:wrap}
.title{font-size:17px;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:24px;height:24px;flex:none}
.sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:#fff}
.check{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.check:hover{color:var(--text)}
.check input{accent-color:var(--accent);margin:0;cursor:pointer}
.hidden{display:none!important}
#listView{flex:1;overflow:auto;padding:18px}
.tablewrap{max-width:1200px;margin:0 auto;overflow-x:auto;background:rgba(var(--panel-rgb),var(--sp-list-alpha,1));border:1px solid var(--line);border-radius:12px}
.table{width:100%;min-width:880px;border-collapse:collapse;table-layout:fixed}
.table th{padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(var(--head-rgb),var(--sp-list-alpha,1));text-align:left}
.table th:nth-child(1){width:34%}
.table th:nth-child(2){width:27%}
.table th:nth-child(3){width:19%}
.table th:nth-child(4){width:20%}
.th{appearance:none;background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.th:hover{color:var(--text)}
.th .arr{font-size:10px;opacity:.5;line-height:1}
.th.active{color:var(--accent)}
.th.active .arr{opacity:1}
.table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;min-width:0}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr.linkable{cursor:pointer}
.table tbody tr.linkable:hover td{background:rgb(var(--hover-rgb))}
.table tbody tr.internal td{opacity:.62}
.table tbody tr.internal:hover td{opacity:.92}
.nameline{display:flex;align-items:center;gap:8px;min-width:0}
.name{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selftag{margin-left:auto;font-size:11px;color:var(--accent);border:1px solid var(--selftag-line);border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.run{background:var(--accent)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.desc{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:3px}
.cellimage{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ports{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:rgb(var(--panel-2-rgb));border:1px solid var(--line);color:var(--text);border-radius:7px;padding:3px 10px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:#fff}
.noports{font-size:12.5px;color:var(--muted)}
.status{font-size:12.5px;color:var(--muted);line-height:1.35}
.empty{color:var(--muted);text-align:center;margin-top:60px}
/* ===== layout switch (header) + secondary "sidebar" layout: one narrow
   single-column list on the left third, wallpaper out front on the right ===== */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgb(var(--panel-2-rgb))}
.seg-btn{appearance:none;border:0;background:transparent;color:var(--muted);font-size:12.5px;line-height:1;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg-btn + .seg-btn{border-left:1px solid var(--line)}
.seg-btn:hover{color:var(--text)}
.seg-btn.active{color:var(--text);background:rgb(var(--hover-rgb))}
/* Icon-only wallpaper stepper, left of the layout switch. Stays subtle:
   muted at rest, dimmed (same .45 disabled language as .ctlbtn) at the
   ends of the collection. */
.seg-arrow{padding:7px 9px}
.seg-arrow:disabled{opacity:.45;cursor:default}
.seg-arrow:disabled:hover{color:var(--muted)}
body[data-layout="sidebar"] #listView{display:flex;gap:18px;overflow:hidden}
body[data-layout="sidebar"] #empty{flex:1}
#sidebar{display:flex;flex-direction:column;align-self:flex-start;flex:0 1 calc(100%/3);min-width:280px;max-width:720px;min-height:0;max-height:100%;background:rgba(var(--panel-rgb),var(--sp-list-alpha,1));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.side-rows{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow-y:auto}
.srow{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);min-width:0}
.side-rows .srow:last-child{border-bottom:0}
.srow:hover{background:rgb(var(--hover-rgb))}
.srow.internal{opacity:.62}
.srow.internal:hover{opacity:.92}
.sname{flex:1;min-width:0;color:inherit;text-decoration:none}
a.sname:hover{color:var(--accent);text-decoration:underline}
.sidectl{display:inline-flex;align-items:center;gap:7px;margin-left:auto;flex:none}
.ctlbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:rgb(var(--panel-2-rgb));color:var(--text);cursor:pointer;flex:none}
.ctlbtn:hover:not(:disabled){border-color:var(--accent);color:#fff}
.ctlbtn:disabled{opacity:.45;cursor:default}
.ctlbtn.update-running svg{animation:ctlspin 1.1s linear infinite}
@keyframes ctlspin{to{transform:rotate(360deg)}}
.side-empty{padding:40px 14px;text-align:center;color:var(--muted);font-size:13px}
#toast{position:fixed;left:18px;bottom:18px;z-index:60;max-width:420px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bad);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
/* ===== appearance: background layer + glass surfaces (docs/appearance-background-handoff.md §6) ===== */
/* Wallpaper layer: fixed, pushed to z-index -1 (paints above body background, below all
   content), oversized so the blur filter never bleeds transparent at the viewport edges.
   The scrim is a second background-image layer — a flat veil whose alpha is --sp-scrim —
   so the slider re-rasterizes live with zero extra JS. Blur = wallpaper blur + glass blur,
   summed into one variable; no backdrop-filter on the app (the layer itself is blurred). */
#sp-bg-layer{position:fixed;inset:-48px;z-index:-1;pointer-events:none;background-repeat:no-repeat;background-position:var(--sp-bg-position,50% 50%);background-size:cover;background-image:linear-gradient(rgba(8,10,18,var(--sp-scrim,0)) 0%,rgba(8,10,18,var(--sp-scrim,0)) 100%),var(--sp-bg-image,none);opacity:var(--sp-bg-opacity,1);filter:blur(var(--sp-bg-blur,0px))}
/* "This portal" / "internal" pills sit on the translucent table: give them a
   translucent base too, but only while a wallpaper is active (default stays
   pixel-identical to the stock look). */
body[data-sp-bg] .selftag{background:rgba(var(--panel-rgb),calc(var(--sp-list-alpha,1)*.55))}
/* Optional true-glass pass: per-surface backdrop blur, applied only while
   glassBlur > 0 (the whole-layer blur above already carries the depth). */
body[data-sp-glass] header,body[data-sp-glass] .tablewrap,body[data-sp-glass] #sidebar{backdrop-filter:blur(var(--sp-glass-blur,0px))}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{display:inline-flex;align-items:center;justify-content:center}
.sp-panel{position:fixed;top:64px;right:16px;z-index:50;width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,.55)}
.sp-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sp-panel-title{font-weight:650;font-size:14px}
.sp-drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-size:13px}
.sp-drop.over{border-color:var(--accent);color:var(--text)}
.sp-thumb{width:100%;height:110px;object-fit:cover;border-radius:8px}
.sp-row{display:flex;gap:8px;margin:10px 0}
.sp-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 0}
.sp-nav-count{font-size:12.5px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.sp-slider{display:block;font-size:12.5px;color:var(--muted);margin-top:10px}
.sp-slider output{float:right;color:var(--text);font-variant-numeric:tabular-nums}
.sp-slider input[type=range]{width:100%;margin:4px 0 0;accent-color:var(--accent);cursor:pointer}
.sp-select{display:block;font-size:12.5px;color:var(--muted);margin-top:10px}
/* Origin grid: a numpad-style 3×3 of anchor points (7 8 9 / 4 5 6 / 1 2 3).
   Each cell's dot marks where the wallpaper's origin sits; the two sliders
   under the grid carry the free offset between anchors. */
.sp-posgrid{display:grid;grid-template-columns:repeat(3,40px);gap:5px;margin:6px 0 0}
.sp-pos{position:relative;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:rgb(var(--panel-2-rgb));cursor:pointer}
.sp-pos::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--muted);left:50%;top:50%;transform:translate(-50%,-50%)}
.sp-pos[data-dot=tl]::after{left:25%;top:25%}
.sp-pos[data-dot=tc]::after{left:50%;top:25%}
.sp-pos[data-dot=tr]::after{left:75%;top:25%}
.sp-pos[data-dot=ml]::after{left:25%;top:50%}
.sp-pos[data-dot=mr]::after{left:75%;top:50%}
.sp-pos[data-dot=bl]::after{left:25%;top:75%}
.sp-pos[data-dot=bc]::after{left:50%;top:75%}
.sp-pos[data-dot=br]::after{left:75%;top:75%}
.sp-pos:hover{border-color:var(--accent)}
.sp-pos[aria-pressed=true]{border-color:var(--accent)}
.sp-pos[aria-pressed=true]::after{background:var(--accent)}
.sp-pos:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sp-pos:disabled{opacity:.45;cursor:default}
.sp-slider input[type=range]:disabled{opacity:.45;cursor:default}
.sp-status{font-size:12.5px;color:var(--bad);min-height:16px;margin-top:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="sp-bg-layer" aria-hidden="true"></div>
<div id="app">
  <header>
    <img class="logo" src="/star.svg" alt="" aria-hidden="true">
    <div class="title" id="title">{{PORTAL_TITLE}}</div>
    <div class="sub" id="meta">loading&hellip;</div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Background image">
      <button id="bgPrev" class="seg-btn seg-arrow" type="button" title="Previous background image" aria-label="Previous background image">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button id="bgNext" class="seg-btn seg-arrow" type="button" title="Next background image" aria-label="Next background image">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
    <div class="seg" role="group" aria-label="List layout">
      <button id="layoutTable" class="seg-btn" type="button" aria-pressed="true" title="Full table — service, image, ports, status">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="9.5" x2="21" y2="9.5"></line><line x1="3" y1="14.5" x2="21" y2="14.5"></line></svg>
        <span>Table</span>
      </button>
      <button id="layoutSidebar" class="seg-btn" type="button" aria-pressed="false" title="Narrow list — the wallpaper fills the rest of the screen">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9.5" y1="4" x2="9.5" y2="20"></line></svg>
        <span>Sidebar</span>
      </button>
    </div>
    <label class="check" title="Hide services with no published ports (nothing to open) — your choice is remembered">
      <input type="checkbox" id="hideNoLink">
      <span>Hide services without links</span>
    </label>
    <button id="refreshBtn" class="btn" type="button">Refresh</button>
    <button id="appearanceBtn" class="btn iconbtn" type="button" title="Appearance &mdash; wallpaper &amp; effects" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
    </button>
  </header>
  <main id="listView">
    <div class="tablewrap hidden" id="tablewrap">
      <table class="table">
        <thead>
          <tr>
            <th scope="col"><button class="th" type="button" data-key="name">Service <span class="arr">&#8597;</span></button></th>
            <th scope="col"><button class="th" type="button" data-key="image">Image <span class="arr">&#8597;</span></button></th>
            <th scope="col"><button class="th" type="button" data-key="ports">Ports <span class="arr">&#8597;</span></button></th>
            <th scope="col"><button class="th" type="button" data-key="status">Status <span class="arr">&#8597;</span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="hidden" id="sidebar">
      <ul class="side-rows" id="sideRows"></ul>
    </div>
    <div class="empty hidden" id="empty"></div>
  </main>
</div>
<div id="appearancePanel" class="sp-panel hidden" role="dialog" aria-label="Appearance">
  <div class="sp-panel-head">
    <span class="sp-panel-title">Appearance</span>
    <button id="appearanceClose" class="btn iconbtn" type="button" title="Close">&times;</button>
  </div>
  <div id="spDropZone" class="sp-drop">
    <img id="spThumb" class="sp-thumb hidden" alt="Current wallpaper">
    <span>Drop an image here, or</span>
    <button id="spUploadBtn" class="btn" type="button">Upload background&hellip;</button>
  </div>
  <input type="file" id="spFile" class="hidden" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple>
  <div class="sp-select" title="Where this wallpaper's origin sits in the cover crop — remembered per wallpaper, on this machine only: pick an anchor (or press 1–9), then fine-tune with the sliders — 0–100% of the way between the cropped edges, snapping back to an anchor near 0/50/100">
    Position
    <div class="sp-posgrid" id="spPosGrid" role="group" aria-label="Wallpaper origin anchor">
      <button id="spPos-tl" class="sp-pos" type="button" data-dot="tl" aria-pressed="false" aria-label="Top left" title="Top left (7)"></button>
      <button id="spPos-tc" class="sp-pos" type="button" data-dot="tc" aria-pressed="false" aria-label="Top" title="Top (8)"></button>
      <button id="spPos-tr" class="sp-pos" type="button" data-dot="tr" aria-pressed="false" aria-label="Top right" title="Top right (9)"></button>
      <button id="spPos-ml" class="sp-pos" type="button" data-dot="ml" aria-pressed="false" aria-label="Left" title="Left (4)"></button>
      <button id="spPos-mc" class="sp-pos" type="button" data-dot="mc" aria-pressed="true" aria-label="Center" title="Center (5)"></button>
      <button id="spPos-mr" class="sp-pos" type="button" data-dot="mr" aria-pressed="false" aria-label="Right" title="Right (6)"></button>
      <button id="spPos-bl" class="sp-pos" type="button" data-dot="bl" aria-pressed="false" aria-label="Bottom left" title="Bottom left (1)"></button>
      <button id="spPos-bc" class="sp-pos" type="button" data-dot="bc" aria-pressed="false" aria-label="Bottom" title="Bottom (2)"></button>
      <button id="spPos-br" class="sp-pos" type="button" data-dot="br" aria-pressed="false" aria-label="Bottom right" title="Bottom right (3)"></button>
    </div>
    <label class="sp-slider" title="Origin's horizontal offset: 0 = flush left, 50 = centered, 100 = flush right">Horizontal <output id="spPosXOut">50%</output>
      <input type="range" id="spPosX" min="0" max="100" step="1" value="50">
    </label>
    <label class="sp-slider" title="Origin's vertical offset: 0 = flush top, 50 = centered, 100 = flush bottom">Vertical <output id="spPosYOut">50%</output>
      <input type="range" id="spPosY" min="0" max="100" step="1" value="50">
    </label>
  </div>
  <div class="sp-row">
    <button id="spRemove" class="btn" type="button" title="Delete the wallpaper you have landed on (the collection closes the gap)">Remove</button>
    <button id="spReset" class="btn" type="button" title="Delete every wallpaper and restore the default settings">Reset</button>
    <button id="spResetColors" class="btn" type="button" title="Drop the wallpaper-derived color scheme (the wallpaper stays)">Reset colors</button>
  </div>
  <label class="sp-slider">Opacity <output id="spOpacityOut">100%</output>
    <input type="range" id="spOpacity" min="0" max="100" step="1" value="100">
  </label>
  <label class="sp-slider">Wallpaper blur <output id="spBlurOut">0px</output>
    <input type="range" id="spBlur" min="0" max="30" step="1" value="0">
  </label>
  <label class="sp-slider">Scrim <output id="spScrimOut">0%</output>
    <input type="range" id="spScrim" min="0" max="100" step="1" value="0">
  </label>
  <label class="sp-slider" title="Opacity of the service list background in both table and sidebar layouts">List background <output id="spListOpacityOut">100%</output>
    <input type="range" id="spListOpacity" min="0" max="100" step="1" value="100">
  </label>
  <label class="sp-slider">Glass blur <output id="spGlassOut">0px</output>
    <input type="range" id="spGlass" min="0" max="20" step="1" value="0">
  </label>
  <div id="spNav" class="sp-nav hidden">
    <button id="spPrev" class="btn iconbtn" type="button" title="Previous wallpaper" aria-label="Previous wallpaper">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span id="spNavCount" class="sp-nav-count"></span>
    <button id="spNext" class="btn iconbtn" type="button" title="Next wallpaper" aria-label="Next wallpaper">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
  <div id="spStatus" class="sp-status" role="status"></div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
let services = [];
let generatedAt = null;
let lastError = null;
let sortKey = 'name';
let sortDir = 1; // 1 = ascending, -1 = descending
const HIDE_KEY = 'sp-hide-no-link';
let hideNoLink = false;
try { hideNoLink = localStorage.getItem(HIDE_KEY) === '1'; } catch (e) {}
const LAYOUT_KEY = 'sp-layout';
let layout = 'table';
try {
  const storedLayout = localStorage.getItem(LAYOUT_KEY);
  if (storedLayout === 'table' || storedLayout === 'sidebar') layout = storedLayout;
} catch (e) {}
document.body.setAttribute('data-layout', layout);

function escapeHtml(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function hostBase(p){
  if (p.hostIp && p.hostIp !== '0.0.0.0' && p.hostIp !== '::') return p.hostIp;
  return location.hostname || 'localhost';
}
const HTTPS_PORTS = new Set([443, 3443, 8443, 9443]);
function schemeFor(p){
  return HTTPS_PORTS.has(p.containerPort) || HTTPS_PORTS.has(p.hostPort) ? 'https' : 'http';
}
function urlFor(svc, p){ return schemeFor(p) + '://' + hostBase(p) + ':' + p.hostPort + '/'; }

function openNewTab(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

let toastTimer = 0;
function toast(msg){
  let el = $('#toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 5000);

const ICON_START = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const ICON_UPDATE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.8-2.6L20 11"/><path d="M4 13l2.1 4.6A7 7 0 0 0 17.9 15"/></svg>';
const maintenancePollers = new Set();

/* Per-row start/stop toggle (sidebar layout). The button reflects the
   container's current state, and a fresh /api/services poll rebuilds the
   rows after every action, so there is no local state to keep in sync. */
function containerToggle(s){
  const running = s.state === 'running';
  const action = running ? 'stop' : 'start';
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ctlbtn';
  b.innerHTML = running ? ICON_STOP : ICON_START;
  if (s.self){
    b.title = 'This is the portal itself \u2014 it cannot control itself';
    b.disabled = true;
    return b;
  }
  b.title = (running ? 'Stop ' : 'Start ') + s.name;
  b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    ev.preventDefault();
    b.disabled = true;
    fetch('/api/services/' + s.id + '/' + action, { method: 'POST' })
      .then((r) => r.json().catch(() => ({})).then((d) => {
        if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
      }))
      .then(() => load())
      .catch((e) => {
        toast((running ? 'Could not stop ' : 'Could not start ') + s.name + ': ' + e.message);
        b.disabled = false;
      });
  });
  return b;
}

function maintenanceMessage(job){
  if (!job) return '';
  if (job.state === 'queued') return 'Update queued';
  if (job.state === 'running') return 'Update and restart in progress';
  if (job.state === 'succeeded') return 'Last update completed successfully';
  if (job.state === 'failed') return 'Last update failed' + (job.error ? ': ' + job.error : '');
  return 'Update status: ' + job.state;
}

function lastUsefulLine(text){
  const lines = String(text || '').split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  const line = lines.length ? lines[lines.length - 1] : '';
  return line.length > 180 ? line.slice(0, 177) + '\u2026' : line;
}

function watchMaintenance(job, serviceName){
  if (!job || !job.id || maintenancePollers.has(job.id)) return;
  maintenancePollers.add(job.id);
  const poll = () => {
    fetch('/api/maintenance/' + encodeURIComponent(job.id), { cache: 'no-store' })
      .then((r) => r.json().catch(() => ({})).then((d) => {
        if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
        return d.job;
      }))
      .then((current) => {
        if (current.state === 'succeeded' || current.state === 'failed') {
          maintenancePollers.delete(job.id);
          load();
          if (current.state === 'succeeded') toast('Updated and restarted ' + serviceName + '.');
          else {
            const detail = current.error || lastUsefulLine(current.logs) || 'unknown maintenance error';
            toast('Could not update ' + serviceName + ': ' + detail);
          }
          return;
        }
        load();
        setTimeout(poll, 1800);
      })
      .catch(() => {
        // Updating this portal intentionally drops the connection while its
        // replacement starts. Keep polling until the persisted job returns.
        setTimeout(poll, 2200);
      });
  };
  poll();
}

function projectUpdateButton(s){
  if (!s.update || !s.update.available) return null;
  const job = s.update.job;
  const active = job && (job.state === 'queued' || job.state === 'running');
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ctlbtn' + (active ? ' update-running' : '');
  b.innerHTML = ICON_UPDATE;
  b.disabled = !!active;
  b.title = active
    ? maintenanceMessage(job) + ' for ' + displayName(s)
    : 'Update and restart ' + displayName(s) + (job ? ' \u2014 ' + maintenanceMessage(job) : '');
  if (active) {
    watchMaintenance(job, displayName(s));
    return b;
  }
  b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    ev.preventDefault();
    if (!window.confirm('Update and restart ' + displayName(s) + '?\n\nThe service may be unavailable while its project rebuilds.')) return;
    b.disabled = true;
    b.classList.add('update-running');
    fetch('/api/projects/' + encodeURIComponent(s.update.project) + '/update', {
      method: 'POST',
      headers: { 'X-Service-Portal-Action': 'update' }
    })
      .then((r) => r.json().catch(() => ({})).then((d) => {
        if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
        return d.job;
      }))
      .then((started) => {
        toast('Update started for ' + displayName(s) + '.');
        watchMaintenance(started, displayName(s));
        load();
      })
      .catch((e) => {
        toast('Could not start update for ' + displayName(s) + ': ' + e.message);
        b.disabled = false;
        b.classList.remove('update-running');
      });
  });
  return b;
}

function published(s){ return s.ports.filter(p => p.hostPort != null); }
function primaryPort(s){
  const ports = published(s);
  return ports.find(p => schemeFor(p) === 'https') || ports[0] || null;
}
function displayName(s){ return s.label || s.name; }

function statusRank(s){
  if (s.state === 'exited' || s.state === 'dead' || s.state === 'created') return 0;
  if (s.health === 'unhealthy') return 1;
  if (s.state === 'restarting') return 2;
  if (s.health === 'starting') return 3;
  return 4; // healthy, or running without health
}

const SORTERS = {
  name:   (a, b) => displayName(a).localeCompare(displayName(b)) || a.name.localeCompare(b.name),
  image:  (a, b) => a.image.localeCompare(b.image) || a.name.localeCompare(b.name),
  ports:  (a, b) => published(a).length - published(b).length || a.name.localeCompare(b.name),
  status: (a, b) => statusRank(a) - statusRank(b) || a.name.localeCompare(b.name),
};

async function load(){
  try {
    const r = await fetch('/api/services', {cache:'no-store'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    services = d.services;
    generatedAt = d.generatedAt;
    lastError = null;
    for (const s of services) {
      const job = s.update && s.update.job;
      if (job && (job.state === 'queued' || job.state === 'running')) {
        watchMaintenance(job, displayName(s));
      }
    }
  } catch (e) {
    lastError = 'could not reach docker: ' + e.message;
  }
  renderList();
}

function renderList(){
  if (lastError){ $('#meta').textContent = lastError; }
  else {
    const visible = services.filter(s => !hideNoLink || published(s).length > 0).length;
    const when = generatedAt ? ' \u00b7 updated ' + new Date(generatedAt).toLocaleTimeString() : '';
    $('#meta').textContent = (hideNoLink && visible !== services.length
      ? visible + ' of ' + services.length
      : services.length) + ' services' + when;
  }

  const rows = services
    .filter(s => !hideNoLink || published(s).length > 0)
    .sort((a, b) => SORTERS[sortKey](a, b) * sortDir);

  const empty = $('#empty');
  if (!services.length){
    $('#tablewrap').classList.add('hidden');
    $('#sidebar').classList.add('hidden');
    empty.textContent = 'No running containers found.';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  const side = layout === 'sidebar';
  $('#tablewrap').classList.toggle('hidden', side);
  $('#sidebar').classList.toggle('hidden', !side);
  if (side) renderSidebar(rows);
  else renderTable(rows);
}

function renderTable(rows){
  for (const b of document.querySelectorAll('button.th')){
    const th = b.parentElement;
    const active = b.dataset.key === sortKey;
    b.classList.toggle('active', active);
    b.querySelector('.arr').textContent = active ? (sortDir === 1 ? '\u25b2' : '\u25bc') : '\u2195';
    if (active) th.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  }

  const wrap = $('#rows');
  wrap.innerHTML = '';
  if (!rows.length){
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 4;
    td.style.textAlign = 'center'; td.style.color = 'var(--muted)'; td.style.padding = '40px 14px';
    td.textContent = 'Every service is hidden \u2014 untick \u201cHide services without links\u201d to see them.';
    tr.appendChild(td);
    wrap.appendChild(tr);
    return;
  }

  for (const s of rows){
    const pub = published(s);
    const primary = primaryPort(s);
    const h = s.health;
    const tr = document.createElement('tr');
    tr.className = pub.length ? 'linkable' : 'internal';
    if (primary) tr.title = urlFor(s, primary);

    const td1 = document.createElement('td');
    const nl = document.createElement('div'); nl.className = 'nameline';
    const dotCls = h ? (h === 'healthy' ? 'ok' : h === 'unhealthy' ? 'bad' : 'warn')
                     : (s.state === 'running' ? 'run' : 'bad');
    const dot = document.createElement('span'); dot.className = 'dot ' + dotCls;
    const nm = document.createElement('span'); nm.className = 'name';
    nm.textContent = displayName(s); nm.title = s.name;
    nl.appendChild(dot); nl.appendChild(nm);
    if (s.self){ const t = document.createElement('span'); t.className = 'selftag'; t.textContent = 'this portal'; nl.appendChild(t); }
    else if (!pub.length){ const t = document.createElement('span'); t.className = 'selftag'; t.textContent = 'internal'; nl.appendChild(t); }
    td1.appendChild(nl);
    if (s.description){ const ds = document.createElement('div'); ds.className = 'desc'; ds.textContent = s.description; td1.appendChild(ds); }
    tr.appendChild(td1);

    const td2 = document.createElement('td');
    td2.className = 'cellimage'; td2.textContent = s.image; td2.title = s.image;
    tr.appendChild(td2);

    const td3 = document.createElement('td');
    const ports = document.createElement('div'); ports.className = 'ports';
    if (!pub.length) ports.innerHTML = '<span class="noports">no published ports</span>';
    for (const p of pub){
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button';
      b.textContent = p.hostPort + (p.protocol && p.protocol !== 'tcp' ? '/' + p.protocol : '');
      b.title = urlFor(s, p);
      b.addEventListener('click', (ev) => { ev.stopPropagation(); openNewTab(urlFor(s, p)); });
      ports.appendChild(b);
    }
    td3.appendChild(ports);
    tr.appendChild(td3);

    const td4 = document.createElement('td');
    td4.className = 'status';
    td4.textContent = escapeHtml((s.statusLine || s.state || '').replace(/\s*\((healthy|unhealthy|starting)\)\s*$/, '')) + (h ? ' \u00b7 ' + h : '');
    tr.appendChild(td4);

    if (primary) tr.addEventListener('click', () => openNewTab(urlFor(s, primary)));
    wrap.appendChild(tr);
  }
}

function renderSidebar(rows){
  const list = $('#sideRows');
  list.innerHTML = '';
  if (!rows.length){
    const li = document.createElement('li');

for (const b of document.querySelectorAll('button.th')){

/* ===== Appearance (wallpaper + glass) =====================================
   Port of the Harness "Appearance" plugin, per
   docs/appearance-background-handoff.md §6, now server-persisted: a
   collection of wallpapers plus the styling settings live on the server
   (GET/PUT /api/appearance, GET/POST/DELETE
   /api/appearance/wallpapers[/<id>]), shared by every client on the
   network. The wallpapers form an ordered array; the *active* one is what
   the portal shows. Prev/next walks the array (previous hidden on the first,
   next hidden on the last), an upload appends a new wallpaper and makes it
   active, and Remove deletes the one you've landed on — the active pointer
   is persisted on the server, so you always come back to the wallpaper you
   left on. Each wallpaper carries its own sampled accent + darkness (the
   theme follows the wallpaper); the styling sliders stay global to the
   portal. This browser keeps a localStorage ('sp-appearance') copy as an
   offline fallback cache, and on first visit with an empty server the
   wallpaper previously stored in this browser's IndexedDB
   ('service-portal-appearance', store 'images') is migrated up once, then
   the local copies are cleared. Every change applies live, in the same tick;
   structural changes sync to the server immediately, slider drags debounced. */
(function () {
  'use strict';

  const DB_NAME = 'service-portal-appearance';
  const IMAGE_STORE = 'images';
  const LS_KEY = 'sp-appearance';

     axis (0 = flush that edge, 50 = centered, 100 = flush the far edge). The
     3×3 grid in the panel is the nine anchor points — the old dropdown's five
     are a subset of them; anything in between is a free offset. Because the
     range is bounded, cover keeps the layer fully covered at every position. */
  const ANCHORS = {
    tl: [0, 0], tc: [50, 0], tr: [100, 0],
    ml: [0, 50], mc: [50, 50], mr: [100, 50],

    if (raw && typeof raw === 'object' && !Array.isArray(raw)) raw = [raw.x, raw.y];

  function positionFor(s) {

     single global value shared by every wallpaper. The first time this
     machine sees the collection, hand that legacy value to every wallpaper

     wallpapers default to center. The flag is deferred until a non-empty

  const MAX_INPUT_BYTES = 209715200;   // 200 MB sanity cap (blobs ride IndexedDB, not localStorage)
  const RESAMPLE_EDGE = 4096;          // longest edge above which we resample
  const RESAMPLE_QUALITY = 0.95;       // WebP quality for resampled images
  const DARK_THRESHOLD = 0.35;         // avg-luminance threshold below which an image counts as dark
  const AUTO_SCRIM = 0.35;             // veil auto-applied when a dark wallpaper is set and the user hasn't touched the scrim

  const ACCENT_HUE_BUCKETS = 12;       // 30° hue bins
  const ACCENT_MIN_SATURATION = 0.18;  // chroma below which a pixel counts as gray and is ignored

  const $id = (s) => document.getElementById(s);
  const els = {
    panel: $id('appearancePanel'),
    gear: $id('appearanceBtn'),
    close: $id('appearanceClose'),
    drop: $id('spDropZone'),
    thumb: $id('spThumb'),
    file: $id('spFile'),
    upload: $id('spUploadBtn'),
    posGrid: $id('spPosGrid'),
    posCells: {
      tl: $id('spPos-tl'), tc: $id('spPos-tc'), tr: $id('spPos-tr'),
      ml: $id('spPos-ml'), mc: $id('spPos-mc'), mr: $id('spPos-mr'),
      bl: $id('spPos-bl'), bc: $id('spPos-bc'), br: $id('spPos-br')
    },
    posX: $id('spPosX'), posXOut: $id('spPosXOut'),

    reset: $id('spReset'),

    blur: $id('spBlur'), blurOut: $id('spBlurOut'),
    scrim: $id('spScrim'), scrimOut: $id('spScrimOut'),
    listOpacity: $id('spListOpacity'), listOpacityOut: $id('spListOpacityOut'),
    glass: $id('spGlass'), glassOut: $id('spGlassOut'),
    nav: $id('spNav'),
    prev: $id('spPrev'),
    next: $id('spNext'),
    navCount: $id('spNavCount'),
    status: $id('spStatus')
  };
  /* Header stepper: the same prev/next walking, reachable from the top
     menu without opening the panel. It stays mounted at all times and
     dims at the ends of the collection (both dim when it is empty). */
  const bgPrev = $id('bgPrev');
  const bgNext = $id('bgNext');

  /* ---- settings: sanitized on read, so stale or hand-edited storage can
          never produce invalid CSS. Also tolerates the pre-collection
          shape still sitting in an offline localStorage cache. ---- */
  function sanitizeSettings(raw) {
    const wallpapers = [];
    if (raw && typeof raw === 'object' && !Array.isArray(raw) && Array.isArray(raw.wallpapers)) {
      for (const w of raw.wallpapers) {
        if (!w || typeof w !== 'object' || typeof w.id !== 'string' || !w.id) continue;
        wallpapers.push({
          id: w.id,
          type: typeof w.type === 'string' ? w.type : '',
          imageDark: w.imageDark === true || w.imageDark === 1,
          accent: typeof w.accent === 'string' && /^#[0-9a-fA-F]{6}$/.test(w.accent) ? w.accent.toLowerCase() : '',
          accentTouched: w.accentTouched === true || w.accentTouched === 1
        });
      }
    }
    const out = {
      wallpapers,
      activeWallpaperId: wallpapers.length
        ? (wallpapers.some((w) => w.id === (raw && raw.activeWallpaperId)) ? raw.activeWallpaperId : wallpapers[0].id)
        : null,
      backgroundPosition: { x: 50, y: 50 },
      backgroundOpacity: 1,
      backgroundBlur: 0,
      scrim: 0,
      surfaceAlpha: 1,
      glassBlur: 0
    };
    if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) return out;
    /* Legacy shared position: kept validated so migrateGlobalPosition() can
       consume it exactly once; the per-wallpaper UI never reads it. */
    out.backgroundPosition = sanitizePosition(raw.backgroundPosition);
    for (const [field, b] of Object.entries(BOUNDS)) {
      const v = raw[field];
      if (typeof v === 'number' && Number.isFinite(v)) out[field] = Math.min(b.max, Math.max(b.min, v));
    }
    return out;
  }

  /* readSettings() is now only the *local fallback cache* — the server is
     the source of truth. */
  function readSettings() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return sanitizeSettings(raw === null ? undefined : JSON.parse(raw));
    } catch (e) {
      return sanitizeSettings(undefined);
    }
  }

  /* ---- server sync: settings PUT (debounced for slider drags, immediate
         for structural changes) + the wallpaper endpoints ---- */
  const WALLPAPERS_URL = '/api/appearance/wallpapers';
  const wallpaperUrl = (id) => WALLPAPERS_URL + '/' + encodeURIComponent(id);
  const PUT_DEBOUNCE_MS = 250;
  let putTimer = 0;

  function putSettings(body) {
    return fetch('/api/appearance', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then((r) => {
      if (!r.ok) throw new Error('settings save failed (HTTP ' + r.status + ')');
      return r.json();
    });
  }

  /* The PUT carries the global sliders and the active pointer; the wallpaper
     collection itself is only ever changed by the wallpaper endpoints, so a
     stale client can never clobber it. */
  function putBodyOf(next) {
    return {
      backgroundOpacity: next.backgroundOpacity,
      backgroundBlur: next.backgroundBlur,
      scrim: next.scrim,
      surfaceAlpha: next.surfaceAlpha,
      glassBlur: next.glassBlur,
      activeWallpaperId: next.activeWallpaperId
    };
  }

  /* Merge the server's authoritative collection + active pointer into our
     intent, keeping whichever slider values are fresher (ours). Returns the
     same object when the server state matches, so callers can detect real
     changes. */
  function adoptServerSettings(next, data) {
    if (!data || !data.settings || !Array.isArray(data.settings.wallpapers)) return next;
    const s = data.settings;
    const active = s.wallpapers.some((w) => w.id === s.activeWallpaperId) ? s.activeWallpaperId : null;
    const changed = JSON.stringify(s.wallpapers) !== JSON.stringify(next.wallpapers) ||
      active !== next.activeWallpaperId;
    return changed ? { ...next, wallpapers: s.wallpapers, activeWallpaperId: active } : next;
  }

  /* Debounced settings push for slider drags; structural changes (upload,
     delete, switch, reset) push immediately so "the wallpaper you landed on"
     survives a tab close before the debounce would fire. The localStorage
     cache is refreshed either way (on success from the server's copy, on
     failure from intent) so a later offline visit still shows the last
     configuration. */
  function pushSettings(next, urgent) {
    const run = () => {
      putSettings(putBodyOf(next)).then((data) => {
        const merged = adoptServerSettings(next, data);
        settings = merged;
        if (merged !== next) {
          applyAppearance(settings);
          syncPanel();
        }
        cacheSettings(settings);
      }).catch(() => cacheSettings(next));
    };
    clearTimeout(putTimer);
    if (urgent) run();
    else putTimer = setTimeout(run, PUT_DEBOUNCE_MS);
  }

  function cacheSettings(s) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* ---- legacy IndexedDB blob store (ported from blob-db.ts / image-store.ts)
          — kept read-only-ish: the wallpapers now live on the server; this is
          only consulted to feed the one-time startup migration. ---- */
  function openBlobDb() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(IMAGE_STORE)) db.createObjectStore(IMAGE_STORE);
      };
      request.onsuccess = () => { resolve(request.result); };
      request.onerror = () => { reject(request.error || new Error('indexeddb open failed')); };
    });
  }

  function runBlobTx(mode, action) {
    return new Promise((resolve, reject) => {
      openBlobDb().then((db) => {
        const transaction = db.transaction(IMAGE_STORE, mode);
        const request = action(transaction.objectStore(IMAGE_STORE));
        let result;
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => { reject(request.error || new Error('indexeddb request failed')); };
        transaction.oncomplete = () => { db.close(); resolve(result); };
        transaction.onerror = () => { reject(transaction.error || new Error('indexeddb transaction failed')); };
      }, reject);
    });
  }

  function getImage(key) {
    return runBlobTx('readonly', (store) => store.get(key)).then((record) =>
      record === undefined ? undefined : record.data);
  }

  function deleteImage(key) {
    return runBlobTx('readwrite', (store) => store.delete(key));
  }

  /* ---- image preparation (ported from image.ts: 200 MB cap, 24×24 darkness
          sample, ≤4096 px keep-original-else-WebP-0.95 resample) ---- */
  function fitWithin(width, height, maxEdge) {
    const safe = (v) => (Number.isFinite(v) && v > 0 ? Math.round(v) : 1);
    if (!Number.isFinite(width) || !Number.isFinite(height) || !Number.isFinite(maxEdge) || maxEdge <= 0)
      return { width: safe(width), height: safe(height) };
    if (width <= 0 || height <= 0) return { width: safe(width), height: safe(height) };
    const scale = Math.min(1, maxEdge / Math.max(width, height));
    return { width: Math.round(width * scale), height: Math.round(height * scale) };
  }

  function sampleImageDarkness(bmp) {
    const grid = 24;
    const canvas = document.createElement('canvas');
    canvas.width = grid;
    canvas.height = grid;
    const context = canvas.getContext('2d');
    if (context === null) return false;
    context.drawImage(bmp, 0, 0, grid, grid);
    let data;
    try {
      data = context.getImageData(0, 0, grid, grid).data;
    } catch (e) {
      return false;
    }
    let sum = 0;
    for (let i = 0; i < data.length; i += 4) {
      sum += (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
    }
    return sum / (grid * grid) < DARK_THRESHOLD;
  }

  /* ---- color math + accent extraction (ported from the harness plugin's
          image.ts: "bucket pixels by hue, weight by saturation, normalize") ----
     The sampled accent keeps the image's dominant hue but is re-normalized to
     fixed S/L so it always works as an accent; derivePalette() then builds the
     whole dark surface family (header → background → panel → input → border)
     around that one hue, so a themed portal harmonizes with its wallpaper. */
  function rgbToHsl(r, g, b, sat, light) {
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
      const delta = max - min;
      s = l > .5 ? delta / (2 - max - min) : delta / (max + min);
      if (max === r) h = ((g - b) / delta + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / delta + 2) / 6;
      else h = ((r - g) / delta + 4) / 6;
    }
    return [h, sat === undefined ? s : sat, light === undefined ? l : light];
  }

  function hslToHex(hsl) {
    const h = hsl[0], s = hsl[1], l = hsl[2];
    const hue = (h - Math.floor(h)) * 6;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(hue % 2 - 1));
    const m = l - c / 2;
    let rgb;
    if (hue < 1) rgb = [c, x, 0];
    else if (hue < 2) rgb = [x, c, 0];
    else if (hue < 3) rgb = [0, c, x];
    else if (hue < 4) rgb = [0, x, c];
    else if (hue < 5) rgb = [x, 0, c];
    else rgb = [c, 0, x];
    const toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return '#' + toHex(rgb[0]) + toHex(rgb[1]) + toHex(rgb[2]);
  }

  function hexToRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255
    ];
  }

  /* Sample a dominant, readable accent from a bitmap: draw onto a fixed 32×32
     grid (constant cost regardless of file size), bucket every non-gray pixel
     into one of 12 hue bins (skipping near-black/near-white, and anything with
     chroma < ACCENT_MIN_SATURATION), weight each bin by count × average
     chroma, take the winner's average RGB and re-normalize it to the target
     S/L. Returns #rrggbb, or null when the image carries no usable hue. */
  function sampleAccentColor(bmp) {
    const grid = 32;
    const canvas = document.createElement('canvas');
    canvas.width = grid;
    canvas.height = grid;
    const context = canvas.getContext('2d');
    if (context === null) return null;
    context.drawImage(bmp, 0, 0, grid, grid);
    let data;
    try {
      data = context.getImageData(0, 0, grid, grid).data;
    } catch (e) {
      return null;
    }
    const buckets = new Array(ACCENT_HUE_BUCKETS);
    for (let i = 0; i < ACCENT_HUE_BUCKETS; i++) buckets[i] = [0, 0, 0, 0, 0]; // rSum,gSum,bSum,count,chromaSum
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      if (l < .08 || l > .92) continue;            // near-black / near-white
      const delta = max - min;
      if (delta < ACCENT_MIN_SATURATION) continue; // gray
      let hue;
      if (max === r) hue = ((g - b) / delta + (g < b ? 6 : 0)) / 6;
      else if (max === g) hue = ((b - r) / delta + 2) / 6;
      else hue = ((r - g) / delta + 4) / 6;
      const acc = buckets[Math.min(ACCENT_HUE_BUCKETS - 1, Math.floor(hue * ACCENT_HUE_BUCKETS))];
      acc[0] += r; acc[1] += g; acc[2] += b; acc[3] += 1; acc[4] += delta;
    }
    let best, bestScore = -1;
    for (const acc of buckets) {
      if (acc[3] === 0) continue;
      const score = acc[3] * (acc[4] / acc[3]);    // count × avg chroma
      if (score > bestScore) { bestScore = score; best = acc; }
    }
    if (best === undefined) return null;
    const [rSum, gSum, bSum, count] = best;
    return hslToHex(rgbToHsl(rSum / count, gSum / count, bSum / count, ACCENT_TARGET_SATURATION, ACCENT_TARGET_LIGHTNESS));
  }

  /* Derive the portal's coordinated dark surface family from one accent
     color. Same hue throughout; lightness steps the surfaces apart
     (background → panel → input → border, harness ratios) plus the portal's
     own header/thead/hover surfaces at the intermediate steps. Text and the
     semantic status colors (--ok/--warn/--bad) are deliberately left alone —
     the derived surfaces stay dark, so the stock light text stays readable. */
  function derivePalette(accentHex) {
    const [h, s] = rgbToHsl(...hexToRgb(accentHex));
    const hex = (sat, light) => hslToHex([h, sat, light]);
    const rgbOf = (sat, light) => {
      const [r, g, b] = hexToRgb(hex(sat, light));
      return Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255);
    };
    return {
      accent: accentHex,
      background: hex(s * .35, .10),
      headerBottomRgb: rgbOf(s * .35, .07),
      headerTopRgb: rgbOf(s * .35, .13),
      panel: hex(s * .35, .16), panelRgb: rgbOf(s * .35, .16),
      headRgb: rgbOf(s * .35, .19),
      input: hex(s * .35, .21), inputRgb: rgbOf(s * .35, .21),
      hoverRgb: rgbOf(s * .35, .24),
      border: hex(s * .25, .34),
      tagLine: hex(s * .45, .32)
    };
  }

  function tryDecode(source) {
    return createImageBitmap(source).catch(() => undefined);
  }

  function resampleWithinEdge(bitmap, keepAlpha) {
    const size = fitWithin(bitmap.width, bitmap.height, RESAMPLE_EDGE);
    const canvas = document.createElement('canvas');
    canvas.width = size.width;
    canvas.height = size.height;
    const ctx = canvas.getContext('2d');
    if (ctx === null) throw new Error('canvas unavailable for resampling');
    ctx.drawImage(bitmap, 0, 0, size.width, size.height);
    return canvasToBlob(canvas, keepAlpha, RESAMPLE_QUALITY);
  }

  function canvasToBlob(canvas, keepAlpha, quality) {
    const type = keepAlpha ? 'image/png' : 'image/webp';
    return new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (blob !== null && blob.type === type) { resolve(blob); return; }
        canvas.toBlob((fallback) => {
          if (fallback === null) reject(new Error('image encoding failed'));
          else resolve(fallback);
        }, 'image/png');
      }, type, quality);
    });
  }

  function prepareImage(source) {
    if (!source.type.startsWith('image/')) throw new Error('unsupported file type "' + source.type + '"');
    if (source.size > MAX_INPUT_BYTES) throw new Error('image exceeds the 200 MB input limit');
    return tryDecode(source).then((bitmap) => {
      if (bitmap === undefined) return { blob: source, imageDark: false, accent: null };
      try {
        const imageDark = sampleImageDarkness(bitmap);
        const accent = sampleAccentColor(bitmap);
        if (Math.max(bitmap.width, bitmap.height) <= RESAMPLE_EDGE)
          return { blob: source, imageDark, accent };
        return resampleWithinEdge(bitmap, source.type === 'image/png').then((blob) => ({ blob, imageDark, accent }));
      } finally {
        bitmap.close();
      }
    });
  }

  /* ---- state ----
     Boot starts on the (local) cache so the page paints immediately, then the
     startup fetch below replaces it with the server's copy. */
  let settings = readSettings();
  /* The one-time legacy migration deliberately does NOT run on this cached
     view: the cache may predate the server's current collection, and a
     stale view could burn the migration flag on wallpaper ids that no
     longer exist. It runs only on the server's copy (or the cache when
     offline) in the startup fetch below. */
  let imageToken = '';

  const activeWallpaper = (s) => {
    const list = Array.isArray(s.wallpapers) ? s.wallpapers : [];
    return list.find((w) => w && w.id === s.activeWallpaperId) || null;
  };

  /* ---- render: the four body variables are the single source of truth ---- */
  function applyAppearance(s) {
    const body = document.body;
    prunePositionMap(s); // the map must never outlive the collection
    body.style.setProperty('--sp-bg-opacity', String(s.backgroundOpacity));
    body.style.setProperty('--sp-bg-blur', (s.backgroundBlur + s.glassBlur) + 'px');
    body.style.setProperty('--sp-scrim', String(s.scrim));
    body.style.setProperty('--sp-list-alpha', String(s.surfaceAlpha));
    const p = positionFor(s); // per wallpaper, per client
    body.style.setProperty('--sp-bg-position', p.x + '% ' + p.y + '%');
    if (s.glassBlur > 0) {
      body.style.setProperty('--sp-glass-blur', s.glassBlur + 'px');
      body.setAttribute('data-sp-glass', '');
    } else {
      body.removeAttribute('data-sp-glass');
      body.style.removeProperty('--sp-glass-blur');
    }
    body.toggleAttribute('data-sp-bg', activeWallpaper(s) !== null);
    applyTheme(s);
    syncWallpaper();
  }

  /* The wallpaper-derived palette, applied as CSS variables on <body>. Every
     themed variable has a stock value in :root, so removing the variables
     (no accent / not a hex) restores the default look exactly. The accent is
     per wallpaper: switching wallpaper switches its theme. */
  const THEME_VARS = [
    '--bg', '--panel', '--panel-rgb', '--panel-2', '--panel-2-rgb', '--line',
    '--accent', '--header-a-rgb', '--header-b-rgb', '--head-rgb', '--hover-rgb',
    '--selftag-line'
  ];
  function applyTheme(s) {
    const body = document.body;
    const w = activeWallpaper(s);
    const accent = (w && w.accent) || '';
    if (/^#[0-9a-f]{6}$/.test(accent)) {
      const p = derivePalette(accent);
      body.style.setProperty('--bg', p.background);
      body.style.setProperty('--panel', p.panel);
      body.style.setProperty('--panel-rgb', p.panelRgb);
      body.style.setProperty('--panel-2', p.input);
      body.style.setProperty('--panel-2-rgb', p.inputRgb);
      body.style.setProperty('--line', p.border);
      body.style.setProperty('--accent', p.accent);
      body.style.setProperty('--header-a-rgb', p.headerTopRgb);
      body.style.setProperty('--header-b-rgb', p.headerBottomRgb);
      body.style.setProperty('--head-rgb', p.headRgb);
      body.style.setProperty('--hover-rgb', p.hoverRgb);
      body.style.setProperty('--selftag-line', p.tagLine);
      body.setAttribute('data-sp-theme', '');
    } else {
      for (const v of THEME_VARS) body.style.removeProperty(v);
      body.removeAttribute('data-sp-theme');
    }
  }

  /* Apply the active wallpaper. The server serves each wallpaper at
     /api/appearance/wallpapers/<id> (Cache-Control: no-store), shared by
     every client on the network. */
  function syncWallpaper() {
    const w = activeWallpaper(settings);
    const token = w ? wallpaperUrl(w.id) : '';
    if (token === imageToken) return;
    imageToken = token;
    const body = document.body;
    if (token === '') {
      body.style.setProperty('--sp-bg-image', 'none');
      setThumb(undefined);
      return;
    }
    body.style.setProperty('--sp-bg-image', 'url("' + token + '")');
    setThumb(token);
  }

  function setThumb(url) {
    if (url) {
      els.thumb.src = url;
      els.thumb.classList.remove('hidden');
    } else {
      els.thumb.removeAttribute('src');
      els.thumb.classList.add('hidden');
    }
  }

  function setStatus(msg) {
    els.status.textContent = msg || '';
  }

  /* ---- apply + persist in the same tick (no save button) ----
     Styling applies live locally; the settings blob lands on the server
     (slider drags debounced, structural changes immediately). */
  function commit(urgent) {
    applyAppearance(settings);
    syncPanel();
    cacheSettings(settings);
    pushSettings(settings, urgent);
  }

  /* Local-only commit: the per-client position map never rides the settings
     PUT, so it needs no cache refresh or push — just repaint and resync. */
  function commitLocal() {
    applyAppearance(settings);
    syncPanel();
  }

  /* ---- upload: every file becomes a new wallpaper appended to the end of
         the collection, and the server makes the newest one active. The
         sampled darkness + accent ride custom headers (the server stores the
         raw image and the meta, it does not decode pixels). Multi-select and
         multi-file drops upload each file in order. ---- */
  async function handleFiles(fileList) {
    const files = Array.prototype.slice.call(fileList || [])
      .filter((f) => f && typeof f.type === 'string' && f.type.startsWith('image/'));
    if (!files.length) return;
    for (let i = 0; i < files.length; i++) {
      setStatus(i === 0 ? 'Uploading…' : 'Uploading ' + (i + 1) + ' of ' + files.length + '…');
      try {
        const prepared = await prepareImage(files[i]);
        const r = await fetch(WALLPAPERS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': prepared.blob.type || 'image/webp',
            'x-sp-image-dark': prepared.imageDark ? '1' : '0',
            'x-sp-accent': prepared.accent || ''
          },
          body: prepared.blob
        });
        if (!r.ok) throw new Error('upload failed (HTTP ' + r.status + ')');
        const data = await r.json();
        if (prepared.imageDark && settings.scrim === 0) settings.scrim = AUTO_SCRIM;
        settings = adoptServerSettings(settings, data);
        commit(true);
      } catch (e) {
        setStatus(e && e.message ? e.message : 'could not use that file');
        return;
      }
    }
    setStatus('');
  }

  function resetColors() {
    const w = activeWallpaper(settings);
    if (!w) return;
    setStatus('');
    fetch(wallpaperUrl(w.id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accent: '', accentTouched: true })
    }).then((r) => {
      if (!r.ok) throw new Error('reset colors failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not reset colors'));
  }

  /* Delete the wallpaper you've landed on; the collection closes the gap and
     the server re-selects the neighbor (the entry before it, when possible). */
  function removeCurrentWallpaper() {
    const w = activeWallpaper(settings);
    if (!w) return;
    setStatus('');
    fetch(wallpaperUrl(w.id), { method: 'DELETE' }).then((r) => {
      if (!r.ok) throw new Error('delete failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not delete wallpaper'));
  }

  function resetAppearance() {
    setStatus('');
    fetch(WALLPAPERS_URL, { method: 'DELETE' }).then((r) => {
      if (!r.ok) throw new Error('reset failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      settings = sanitizeSettings(undefined); // wipe everything: no collection, default sliders
      positionMap = {}; // the wallpapers are gone — so are their per-client origins
      writePositionMap();
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not reset appearance'));
  }

  function isDefault() {
    const list = Array.isArray(settings.wallpapers) ? settings.wallpapers : [];
    return list.length === 0 &&
      settings.backgroundOpacity === 1 && settings.backgroundBlur === 0 &&
      settings.scrim === 0 && settings.surfaceAlpha === 1 && settings.glassBlur === 0;
  }

  function syncPanel() {
    els.opacity.value = String(Math.round(settings.backgroundOpacity * 100));
    els.opacityOut.textContent = Math.round(settings.backgroundOpacity * 100) + '%';
    /* Position controls track the active wallpaper's own origin (stored per
       client). With no wallpaper they dim, and the magnetic hysteresis
       reference is dropped so a stale value from the previous wallpaper
       cannot snap the new one. */
    const wp = activeWallpaper(settings);
    const pos = positionFor(settings);
    const hasWp = wp !== null;
    els.posX.value = String(Math.round(pos.x));
    els.posXOut.textContent = Math.round(pos.x) + '%';
    els.posY.value = String(Math.round(pos.y));
    els.posYOut.textContent = Math.round(pos.y) + '%';
    els.posX.disabled = !hasWp;
    els.posY.disabled = !hasWp;
    for (const key of POS_CELLS) {
      const a = ANCHORS[key];
      els.posCells[key].disabled = !hasWp;
      els.posCells[key].setAttribute('aria-pressed', String(hasWp && a[0] === pos.x && a[1] === pos.y));
    }
    if (lastPosWp !== (hasWp ? wp.id : null)) {
      lastPosWp = hasWp ? wp.id : null;
      lastPos = null;
    }
    els.blur.value = String(settings.backgroundBlur);
    els.blurOut.textContent = settings.backgroundBlur + 'px';
    els.scrim.value = String(Math.round(settings.scrim * 100));
    els.scrimOut.textContent = Math.round(settings.scrim * 100) + '%';
    els.listOpacity.value = String(Math.round(settings.surfaceAlpha * 100));
    els.listOpacityOut.textContent = Math.round(settings.surfaceAlpha * 100) + '%';
    els.glass.value = String(settings.glassBlur);
    els.glassOut.textContent = settings.glassBlur + 'px';
    const list = Array.isArray(settings.wallpapers) ? settings.wallpapers : [];
    const idx = settings.activeWallpaperId ? list.findIndex((w) => w.id === settings.activeWallpaperId) : -1;
    els.nav.classList.toggle('hidden', list.length === 0);
    els.prev.classList.toggle('hidden', idx <= 0);
    els.next.classList.toggle('hidden', idx === -1 || idx >= list.length - 1);
    bgPrev.disabled = idx <= 0;
    bgNext.disabled = idx === -1 || idx >= list.length - 1;
    els.navCount.textContent = list.length ? (idx + 1) + ' of ' + list.length : 'none';
    els.remove.disabled = list.length === 0;
    els.reset.disabled = isDefault();
    els.resetColors.disabled = idx === -1 || !list[idx] || list[idx].accent === '';
  }

  /* ---- panel wiring ---- */
  const panelOpen = () => !els.panel.classList.contains('hidden');
  const openPanel = (open) => els.panel.classList.toggle('hidden', !open);

  els.gear.addEventListener('click', () => openPanel(!panelOpen()));
  els.close.addEventListener('click', () => openPanel(false));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panelOpen()) openPanel(false);
  });

  /* Walk the collection: previous hidden on the first wallpaper, next hidden
     on the last. The active pointer is persisted immediately (not debounced),
     so the page always comes back to the wallpaper you landed on. */
  function stepActive(delta) {
    const list = Array.isArray(settings.wallpapers) ? settings.wallpapers : [];
    if (!list.length) return;
    const idx = settings.activeWallpaperId ? list.findIndex((w) => w.id === settings.activeWallpaperId) : -1;
    const target = idx + delta;
    if (target < 0 || target >= list.length) return;
    settings.activeWallpaperId = list[target].id;
    commit(true);
  }
  els.prev.addEventListener('click', () => stepActive(-1));
  els.next.addEventListener('click', () => stepActive(1));
  bgPrev.addEventListener('click', () => stepActive(-1));
  bgNext.addEventListener('click', () => stepActive(1));

  els.upload.addEventListener('click', () => els.file.click());
  els.file.addEventListener('change', () => {
    handleFiles(els.file.files);
    els.file.value = '';   // reset so the same files can be picked again
  });

  let dragDepth = 0;
  els.drop.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth += 1;
    els.drop.classList.add('over');
  });
  els.drop.addEventListener('dragover', (e) => { e.preventDefault(); });
  els.drop.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) els.drop.classList.remove('over');
  });
  els.drop.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    els.drop.classList.remove('over');
    handleFiles(e.dataTransfer && e.dataTransfer.files);
  });

  /* Position: a numpad-style 3×3 anchor grid plus two sliders carrying the
     free offset between anchors — all of it scoped to the *active*
     wallpaper and stored per client (the map never rides the settings PUT).
     The sliders are magnetic: a value snaps to a 0/50/100 detent only when
     it *enters* the detent's zone from outside, so you can always step out
     of an anchor again (arrow keys included) instead of being pinned to it. */
  const setAnchor = (key) => {
    const a = ANCHORS[key];
    const w = activeWallpaper(settings);
    if (!a || !w) return;
    positionMap[w.id] = { x: a[0], y: a[1] };
    lastPos = { x: a[0], y: a[1] }; // the anchor becomes the hysteresis reference
    writePositionMap();
    commitLocal();
  };
  for (const key of POS_CELLS) {
    els.posCells[key].addEventListener('click', () => setAnchor(key));
  }
  const NUMPAD_KEYS = { '7': 'tl', '8': 'tc', '9': 'tr', '4': 'ml', '5': 'mc', '6': 'mr', '1': 'bl', '2': 'bc', '3': 'br' };
  els.posGrid.addEventListener('keydown', (e) => {
    const key = NUMPAD_KEYS[e.key];
    if (key) { e.preventDefault(); setAnchor(key); }
  });
  const bindPosSlider = (axis, input, out) => {
    input.addEventListener('input', () => {
      const w = activeWallpaper(settings);
      if (!w) return;
      if (!lastPos) lastPos = { x: positionFor(settings).x, y: positionFor(settings).y };
      let v = Number(input.value);
      for (const d of POS_DETENTS) {
        const inZone = (val) => Math.abs(val - d) <= POS_SNAP;
        if (inZone(v) && !inZone(lastPos[axis])) { v = d; input.value = String(d); break; }
      }
      lastPos[axis] = v;
      const pos = positionMap[w.id] || { x: 50, y: 50 };
      pos[axis] = v;
      positionMap[w.id] = pos;
      writePositionMap();
      out.textContent = v + '%';
      commitLocal();
    });
  };
  bindPosSlider('x', els.posX, els.posXOut);
  bindPosSlider('y', els.posY, els.posYOut);

  els.remove.addEventListener('click', removeCurrentWallpaper);
  els.reset.addEventListener('click', resetAppearance);
  els.resetColors.addEventListener('click', resetColors);

  /* Sliders use 'input' (not 'change') so the page restyles live while dragging. */
  const bindSlider = (input, out, apply, format) => {
    input.addEventListener('input', () => {
      apply(Number(input.value));
      out.textContent = format(input.value);
      commit();
    });
  };
  bindSlider(els.opacity, els.opacityOut, (v) => { settings.backgroundOpacity = v / 100; }, (v) => v + '%');
  bindSlider(els.blur, els.blurOut, (v) => { settings.backgroundBlur = v; }, (v) => v + 'px');
  bindSlider(els.scrim, els.scrimOut, (v) => { settings.scrim = v / 100; }, (v) => v + '%');
  bindSlider(els.listOpacity, els.listOpacityOut, (v) => { settings.surfaceAlpha = v / 100; }, (v) => v + '%');
  bindSlider(els.glass, els.glassOut, (v) => { settings.glassBlur = v; }, (v) => v + 'px');

  /* Cross-tab sync: change the wallpaper in one tab, every other tab follows
     (each tab's debounced PUT is what updates the shared server state). */
  window.addEventListener('storage', (e) => {
    if (e.key !== LS_KEY) return;
    settings = readSettings();
    applyAppearance(settings);
    syncPanel();
  });

  /* ---- one-time migration from the browser-only era ----
     If the server has no wallpapers yet but this browser still holds one in
     its old IndexedDB (or a legacy inline data URL), push it up as the first
     wallpaper of the collection and clear the local copies. The server's
     existing sliders stay authoritative; only the wallpaper (and its dark
     flag) comes along. */
  function migrateLegacy(serverSettings) {
    if (Array.isArray(serverSettings.wallpapers) && serverSettings.wallpapers.length > 0) return;
    let legacyToken = '';
    try {
      const rawJson = localStorage.getItem(LS_KEY);
      const raw = rawJson === null ? {} : JSON.parse(rawJson);
      if (raw && typeof raw.backgroundImage === 'string' &&
          raw.backgroundImage !== '' && raw.backgroundImage !== 'server') {
        legacyToken = raw.backgroundImage;
      }
    } catch (e) { return; }
    if (!legacyToken) return;
    const source = legacyToken.startsWith('data:')
      ? fetch(legacyToken).then((r) => r.blob()).catch(() => undefined)
      : getImage(legacyToken).catch(() => undefined);
    source.then(async (blob) => {
      if (blob === undefined) {
        if (!legacyToken.startsWith('data:')) deleteImage(legacyToken).catch(() => {});
        return;
      }
      const prepared = await prepareImage(blob);
      const r = await fetch(WALLPAPERS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': blob.type || 'image/webp',
          'x-sp-image-dark': prepared.imageDark ? '1' : '0',
          'x-sp-accent': prepared.accent || ''
        },
        body: prepared.blob
      });
      if (!r.ok) throw new Error('migration upload failed (HTTP ' + r.status + ')');
      const data = await r.json();
      if (!legacyToken.startsWith('data:')) deleteImage(legacyToken).catch(() => {});
      if (prepared.imageDark && settings.scrim === 0) settings.scrim = AUTO_SCRIM;
      settings = adoptServerSettings(settings, data);
      cacheSettings(settings);
      applyAppearance(settings);
      syncPanel();
      pushSettings(settings, true);
    }).catch(() => {});
  }

  /* ---- one-time theme adoption: fires only for an active wallpaper whose
     accent has never been decided (accentTouched still false — i.e. it
     predates the auto color scheme). Samples it once and records the accent
     plus the touched marker on that wallpaper's entry, so a hueless
     wallpaper (accent stays '') and a deliberately cleared theme are never
     re-sampled. */
  function maybeSampleAccent(serverSettings) {
    const w = activeWallpaper(serverSettings);
    if (!w || w.accentTouched) return;
    fetch(wallpaperUrl(w.id)).then((r) => (r.ok ? r.blob() : undefined)).then((blob) => {
      if (blob === undefined) return;
      return tryDecode(blob).then((bmp) => {
        if (bmp === undefined) return;
        const accent = sampleAccentColor(bmp) || '';
        bmp.close();
        return fetch(wallpaperUrl(w.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accent, accentTouched: true })
        }).then((r) => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then((data) => {
          const cur = activeWallpaper(settings);
          if (!cur || cur.id !== w.id || cur.accentTouched) return; // superseded by newer activity
          settings = adoptServerSettings(settings, data);
          cacheSettings(settings);
          applyAppearance(settings);
          syncPanel();
        });
      });
    }).catch(() => {});
  }

  /* ---- startup: the server is the source of truth; the local cache is the
     offline fallback. The page already painted with the cache above. ---- */
  fetch('/api/appearance').then((r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then((data) => {
    const serverSettings = sanitizeSettings(data && data.settings);
    migrateGlobalPosition(serverSettings); // same one-time rule, server's copy
    settings = serverSettings;
    applyAppearance(settings);
    syncPanel();
    cacheSettings(settings);
    migrateLegacy(serverSettings);
    maybeSampleAccent(serverSettings);
  }).catch(() => {
    /* server unreachable: keep the cached appearance, changes will sync once
       the network returns (the next PUT retries on any edit) */
    settings = readSettings();
    migrateGlobalPosition(settings); // same one-time rule, cached copy
    applyAppearance(settings);
    syncPanel();
  });
})();
</script>
</body>
</html>
