    els.status.textContent = msg || '';
  }

  /* ---- apply + persist in the same tick (no save button) ----
     Styling applies live locally; the settings blob lands on the server
     (slider drags debounced, structural changes immediately). */
  function commit(urgent) {
    applyAppearance(settings);
    syncPanel();
    cacheSettings(settings);
    pushSettings(settings, urgent);
  }

  /* Local-only commit: the per-client position map never rides the settings
     PUT, so it needs no cache refresh or push — just repaint and resync. */
  function commitLocal() {
    applyAppearance(settings);
    syncPanel();
  }

  /* ---- upload: every file becomes a new wallpaper in the *active* slot.
         With no slot at all the first file creates one. The sampled
         darkness + accent ride custom headers (the server stores the raw
         image and the meta, it does not decode pixels). Multi-select and
         multi-file drops upload each file in order; the currently displayed
         wallpaper is kept when it survives the upload, otherwise a fresh
         roll picks one of the slot's wallpapers. ---- */
  async function handleFiles(fileList) {
    const files = Array.prototype.slice.call(fileList || [])
      .filter((f) => f && typeof f.type === 'string' && f.type.startsWith('image/'));
    if (!files.length) return;
    /* The first upload of an empty portal must create a slot to upload into
       (the server creates one too, but only *after* the upload — with no
       slot there is nothing to address the upload to). */
    if (!activeSlot(settings)) {
      try {
        const r = await fetch(SLOTS_URL, { method: 'POST' });
        if (!r.ok) throw new Error('slot create failed (HTTP ' + r.status + ')');
        settings = adoptServerSettings(settings, await r.json());
      } catch (e) {
        setStatus(e && e.message ? e.message : 'could not create a slot');
        return;
      }
    }
    const slotId = activeSlot(settings) ? activeSlot(settings).id : settings.activeSlotId;
    for (let i = 0; i < files.length; i++) {
      setStatus(i === 0 ? 'Uploading…' : 'Uploading ' + (i + 1) + ' of ' + files.length + '…');
      try {
        const prepared = await prepareImage(files[i]);
        const r = await fetch(slotWallpapersUrl(slotId), {
          method: 'POST',
          headers: {
            'Content-Type': prepared.blob.type || 'image/webp',
            'x-sp-image-dark': prepared.imageDark ? '1' : '0',
            'x-sp-accent': prepared.accent || ''
          },
          body: prepared.blob
        });
        if (!r.ok) throw new Error('upload failed (HTTP ' + r.status + ')');
        const data = await r.json();
        if (prepared.imageDark && settings.scrim === 0) settings.scrim = AUTO_SCRIM;
        settings = adoptServerSettings(settings, data);
        displayedWallpaper(settings); // re-rolls if the pick no longer exists
        commit(true);
      } catch (e) {
        setStatus(e && e.message ? e.message : 'could not use that file');
        return;
      }
    }
    setStatus('');
  }

  function resetColors() {
    const w = displayedWallpaper(settings);
    if (!w) return;
    setStatus('');
    fetch(wallpaperUrl(w.id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accent: '', accentTouched: true })
    }).then((r) => {
      if (!r.ok) throw new Error('reset colors failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not reset colors'));
  }

  /* Delete the wallpaper currently on screen; a drained slot is removed by
     the server too, and the active slot moves to the previous one (the
     entry before it, when possible). */
  function removeCurrentWallpaper() {
    const w = displayedWallpaper(settings);
    if (!w) return;
    setStatus('');
    fetch(wallpaperUrl(w.id), { method: 'DELETE' }).then((r) => {
      if (!r.ok) throw new Error('delete failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      displayedId = null; // the pick was just deleted — roll a replacement
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not delete wallpaper'));
  }

  /* Remove one wallpaper of the active slot by id (the thumbnail ×); same
     drained-slot rules as removeCurrentWallpaper. */
  function removeWallpaperById(id) {
    setStatus('');
    fetch(wallpaperUrl(id), { method: 'DELETE' }).then((r) => {
      if (!r.ok) throw new Error('delete failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      if (displayedId === id) displayedId = null;
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not delete wallpaper'));
  }

  /* Click a thumbnail: show that specific wallpaper of the slot deliberately
     (local only — the next slot navigation re-rolls). */
  function showWallpaper(id) {
    const w = displayedWallpaper(settings);
    const slot = activeSlot(settings);
    if (!w || !slot || !slot.wallpapers.some((x) => x.id === id)) return;
    displayedId = id;
    commitLocal();
  }

  /* "Add slot": append an empty slot and jump to it (the server does both).
     An empty slot shows no wallpaper until its first upload. */
  function addSlot() {
    setStatus('');
    fetch(SLOTS_URL, { method: 'POST' }).then((r) => {
      if (!r.ok) throw new Error('slot create failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      displayedId = null;
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not add a slot'));
  }

  /* "Remove slot": delete the active slot and every wallpaper in it (the
     server lands the pointer on the previous slot). */
  function removeSlot() {
    const slot = activeSlot(settings);
    if (!slot) return;
    setStatus('');
    fetch(SLOTS_URL + '/' + encodeURIComponent(slot.id), { method: 'DELETE' }).then((r) => {
      if (!r.ok) throw new Error('slot delete failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      displayedId = null; // the whole slot — including any pick — is gone
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not remove the slot'));
  }

  /* "Move slot": shift the active slot one position in the navigation order.
     The slot's wallpapers — and this browser's current pick — travel with it:
     the pointer is an id, the displayed id still exists in the (now
     repositioned) slot, so no re-roll happens on a successful move. */
  function moveSlot(delta) {
    const slot = activeSlot(settings);
    if (!slot) return;
    setStatus('');
    fetch(SLOTS_URL + '/' + encodeURIComponent(slot.id) + '/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ delta: delta })
    }).then((r) => {
      if (!r.ok) throw new Error('slot move failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      commit(true); // pick survives: the id is still in the active slot
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not move the slot'));
  }

  /* "Reset appearance": wipe every slot and its wallpapers. */
  function resetAppearance() {
    setStatus('');
    fetch(SLOTS_URL, { method: 'DELETE' }).then((r) => {
      if (!r.ok) throw new Error('reset failed (HTTP ' + r.status + ')');
      return r.json();
    }).then((data) => {
      settings = adoptServerSettings(settings, data);
      settings = sanitizeSettings(undefined); // wipe everything: no slots, default sliders
      displayedId = null;
      positionMap = {}; // the wallpapers are gone — so are their per-client origins
      writePositionMap();
      commit(true);
    }).catch((e) => setStatus(e && e.message ? e.message : 'could not reset appearance'));
  }

  function isDefault() {
    const list = Array.isArray(settings.slots) ? settings.slots : [];
    return list.length === 0 &&
      settings.backgroundOpacity === 1 && settings.backgroundBlur === 0 &&
      settings.scrim === 0 && settings.surfaceAlpha === 1 && settings.glassBlur === 0;
  }

  /* ---- thumbnail strip: one item per wallpaper of the active slot. Click
         an item to show it (deliberate pick until the next roll); × removes
         just that wallpaper. Hidden while the slot is empty. ---- */
  function renderSlotThumbs() {
    const slot = activeSlot(settings);
    const list = slot && Array.isArray(slot.wallpapers) ? slot.wallpapers : [];
    els.thumbsWrap.classList.toggle('hidden', list.length === 0);
    els.thumbs.textContent = '';
    for (const w of list) {
      const item = document.createElement('div');
      item.className = 'sp-thumb-item' + (w.id === displayedId ? ' current' : '');
      item.title = 'Show this wallpaper';
      const img = document.createElement('img');
      img.src = wallpaperUrl(w.id);
      img.alt = '';
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'sp-thumb-del';
      del.textContent = '×';
      del.title = 'Remove this wallpaper';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        removeWallpaperById(w.id);
      });
      item.appendChild(img);
      item.appendChild(del);
      item.addEventListener('click', () => showWallpaper(w.id));
      els.thumbs.appendChild(item);
    }
  }

  function syncPanel() {
    els.opacity.value = String(Math.round(settings.backgroundOpacity * 100));
    els.opacityOut.textContent = Math.round(settings.backgroundOpacity * 100) + '%';
    /* Position controls track the active wallpaper's own origin (stored per
       client). With no wallpaper they dim, and the magnetic hysteresis
       reference is dropped so a stale value from the previous wallpaper
       cannot snap the new one. */
    const wp = displayedWallpaper(settings);
    const pos = positionFor(settings);
    const hasWp = wp !== null;
    els.posX.value = String(Math.round(pos.x));
    els.posXOut.textContent = Math.round(pos.x) + '%';
    els.posY.value = String(Math.round(pos.y));
    els.posYOut.textContent = Math.round(pos.y) + '%';
    els.posX.disabled = !hasWp;
    els.posY.disabled = !hasWp;
    for (const key of POS_CELLS) {
      const a = ANCHORS[key];
      els.posCells[key].disabled = !hasWp;
      els.posCells[key].setAttribute('aria-pressed', String(hasWp && a[0] === pos.x && a[1] === pos.y));
    }
    if (lastPosWp !== (hasWp ? wp.id : null)) {
      lastPosWp = hasWp ? wp.id : null;
      lastPos = null;
    }
    els.blur.value = String(settings.backgroundBlur);
    els.blurOut.textContent = settings.backgroundBlur + 'px';
    els.scrim.value = String(Math.round(settings.scrim * 100));
    els.scrimOut.textContent = Math.round(settings.scrim * 100) + '%';
    els.listOpacity.value = String(Math.round(settings.surfaceAlpha * 100));
    els.listOpacityOut.textContent = Math.round(settings.surfaceAlpha * 100) + '%';
    els.glass.value = String(settings.glassBlur);
    els.glassOut.textContent = settings.glassBlur + 'px';
    const list = Array.isArray(settings.slots) ? settings.slots : [];
    const idx = settings.activeSlotId ? list.findIndex((s) => s.id === settings.activeSlotId) : -1;
    els.nav.classList.toggle('hidden', list.length === 0);
    els.prev.classList.toggle('hidden', idx <= 0);
    els.next.classList.toggle('hidden', idx === -1 || idx >= list.length - 1);
    bgPrev.disabled = idx <= 0;
    bgNext.disabled = idx === -1 || idx >= list.length - 1;
    els.navCount.textContent = list.length ? (idx + 1) + ' of ' + list.length : 'none';
    els.remove.disabled = idx === -1 || !list[idx] || list[idx].wallpapers.length === 0;
    els.reset.disabled = isDefault();
    els.resetColors.disabled = !wp || wp.accent === '';
    els.removeSlot.disabled = idx === -1;
    els.moveUp.disabled = idx <= 0;
    els.moveDown.disabled = idx === -1 || idx >= list.length - 1;
    renderSlotThumbs();
  }

  /* ---- panel wiring ---- */
  const panelOpen = () => !els.panel.classList.contains('hidden');
  const openPanel = (open) => els.panel.classList.toggle('hidden', !open);

  els.gear.addEventListener('click', () => openPanel(!panelOpen()));
  els.close.addEventListener('click', () => openPanel(false));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panelOpen()) openPanel(false);
  });

  /* Walk the slot collection: previous hidden on the first slot, next hidden
     on the last. Every step re-rolls the random wallpaper of the newly
     active slot (that's the whole point of multi-wallpaper slots), and the
     active-slot pointer is persisted immediately (not debounced), so the
     page always comes back to the slot you left on — with a fresh roll. */
  function stepSlot(delta) {
    const list = Array.isArray(settings.slots) ? settings.slots : [];
    if (!list.length) return;
    const idx = settings.activeSlotId ? list.findIndex((s) => s.id === settings.activeSlotId) : -1;
    const target = idx + delta;
    if (target < 0 || target >= list.length) return;
    settings.activeSlotId = list[target].id;
    displayedId = null;
    rollSlot(settings);
    commit(true);
  }
  els.prev.addEventListener('click', () => stepSlot(-1));
  els.next.addEventListener('click', () => stepSlot(1));
  bgPrev.addEventListener('click', () => stepSlot(-1));
  bgNext.addEventListener('click', () => stepSlot(1));

  els.upload.addEventListener('click', () => els.file.click());
  els.file.addEventListener('change', () => {
    handleFiles(els.file.files);
    els.file.value = '';   // reset so the same files can be picked again
  });

  let dragDepth = 0;
  els.drop.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth += 1;
    els.drop.classList.add('over');
  });
  els.drop.addEventListener('dragover', (e) => { e.preventDefault(); });
  els.drop.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) els.drop.classList.remove('over');
  });
  els.drop.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    els.drop.classList.remove('over');
    handleFiles(e.dataTransfer && e.dataTransfer.files);
  });

  /* Position: a numpad-style 3×3 anchor grid plus two sliders carrying the
     free offset between anchors — all of it scoped to the *active*
     wallpaper and stored per client (the map never rides the settings PUT).
     The sliders are magnetic: a value snaps to a 0/50/100 detent only when
     it *enters* the detent's zone from outside, so you can always step out
     of an anchor again (arrow keys included) instead of being pinned to it. */
  const setAnchor = (key) => {
    const a = ANCHORS[key];
    const w = displayedWallpaper(settings);
    if (!a || !w) return;
    positionMap[w.id] = { x: a[0], y: a[1] };
    lastPos = { x: a[0], y: a[1] }; // the anchor becomes the hysteresis reference
    writePositionMap();
    commitLocal();
  };
  for (const key of POS_CELLS) {
    els.posCells[key].addEventListener('click', () => setAnchor(key));
  }
  const NUMPAD_KEYS = { '7': 'tl', '8': 'tc', '9': 'tr', '4': 'ml', '5': 'mc', '6': 'mr', '1': 'bl', '2': 'bc', '3': 'br' };
  els.posGrid.addEventListener('keydown', (e) => {
    const key = NUMPAD_KEYS[e.key];
    if (key) { e.preventDefault(); setAnchor(key); }
  });
  const bindPosSlider = (axis, input, out) => {
    input.addEventListener('input', () => {
      const w = displayedWallpaper(settings);
      if (!w) return;
      if (!lastPos) lastPos = { x: positionFor(settings).x, y: positionFor(settings).y };
      let v = Number(input.value);
      for (const d of POS_DETENTS) {
        const inZone = (val) => Math.abs(val - d) <= POS_SNAP;
        if (inZone(v) && !inZone(lastPos[axis])) { v = d; input.value = String(d); break; }
      }
      lastPos[axis] = v;
      const pos = positionMap[w.id] || { x: 50, y: 50 };
      pos[axis] = v;
      positionMap[w.id] = pos;
      writePositionMap();
      out.textContent = v + '%';
      commitLocal();
    });
  };
  bindPosSlider('x', els.posX, els.posXOut);
  bindPosSlider('y', els.posY, els.posYOut);

  els.remove.addEventListener('click', removeCurrentWallpaper);
  els.reset.addEventListener('click', resetAppearance);
  els.resetColors.addEventListener('click', resetColors);
  els.addSlot.addEventListener('click', addSlot);
  els.removeSlot.addEventListener('click', removeSlot);
  els.moveUp.addEventListener('click', () => moveSlot(-1));
  els.moveDown.addEventListener('click', () => moveSlot(1));

  /* Sliders use 'input' (not 'change') so the page restyles live while dragging. */
  const bindSlider = (input, out, apply, format) => {
    input.addEventListener('input', () => {
      apply(Number(input.value));
      out.textContent = format(input.value);
      commit();
    });
  };
  bindSlider(els.opacity, els.opacityOut, (v) => { settings.backgroundOpacity = v / 100; }, (v) => v + '%');
  bindSlider(els.blur, els.blurOut, (v) => { settings.backgroundBlur = v; }, (v) => v + 'px');
  bindSlider(els.scrim, els.scrimOut, (v) => { settings.scrim = v / 100; }, (v) => v + '%');
  bindSlider(els.listOpacity, els.listOpacityOut, (v) => { settings.surfaceAlpha = v / 100; }, (v) => v + '%');
  bindSlider(els.glass, els.glassOut, (v) => { settings.glassBlur = v; }, (v) => v + 'px');

  /* Cross-tab sync: change the wallpaper in one tab, every other tab follows
     (each tab's debounced PUT is what updates the shared server state). */
  window.addEventListener('storage', (e) => {
    if (e.key !== LS_KEY) return;
    settings = readSettings();
    applyAppearance(settings);
    syncPanel();
  });

  /* ---- one-time migration from the browser-only era ----
     If the server's slot collection holds no wallpapers at all but this
     browser still holds one in its old IndexedDB (or a legacy inline data
     URL), push it up into the active slot (creating one if the collection is
     empty) and clear the local copies. The server's existing sliders stay
     authoritative; only the wallpaper (and its dark flag) comes along. */
  function migrateLegacy(serverSettings) {
    const allWps = [];
    if (Array.isArray(serverSettings.slots)) for (const slot of serverSettings.slots) for (const w of (slot && Array.isArray(slot.wallpapers) ? slot.wallpapers : [])) allWps.push(w);
    if (allWps.length > 0) return;
    let legacyToken = '';
    try {
      const rawJson = localStorage.getItem(LS_KEY);
      const raw = rawJson === null ? {} : JSON.parse(rawJson);
      if (raw && typeof raw.backgroundImage === 'string' &&
          raw.backgroundImage !== '' && raw.backgroundImage !== 'server') {
        legacyToken = raw.backgroundImage;
      }
    } catch (e) { return; }
    if (!legacyToken) return;
    const source = legacyToken.startsWith('data:')
      ? fetch(legacyToken).then((r) => r.blob()).catch(() => undefined)
      : getImage(legacyToken).catch(() => undefined);
    source.then(async (blob) => {
      if (blob === undefined) {
        if (!legacyToken.startsWith('data:')) deleteImage(legacyToken).catch(() => {});
        return;
      }
      const prepared = await prepareImage(blob);
      const r = await fetch(WALLPAPERS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': blob.type || 'image/webp',
          'x-sp-image-dark': prepared.imageDark ? '1' : '0',
          'x-sp-accent': prepared.accent || ''
        },
        body: prepared.blob
      });
      if (!r.ok) throw new Error('migration upload failed (HTTP ' + r.status + ')');
      const data = await r.json();
      if (!legacyToken.startsWith('data:')) deleteImage(legacyToken).catch(() => {});
      if (prepared.imageDark && settings.scrim === 0) settings.scrim = AUTO_SCRIM;
      settings = adoptServerSettings(settings, data);
      cacheSettings(settings);
      applyAppearance(settings);
      syncPanel();
      pushSettings(settings, true);
    }).catch(() => {});
  }

  /* ---- one-time theme adoption: fires only for an active wallpaper whose
     accent has never been decided (accentTouched still false — i.e. it
     predates the auto color scheme). Samples it once and records the accent
     plus the touched marker on that wallpaper's entry, so a hueless
     wallpaper (accent stays '') and a deliberately cleared theme are never
     re-sampled. */
  function maybeSampleAccent(serverSettings) {
    const w = displayedWallpaper(serverSettings);
    if (!w || w.accentTouched) return;
    fetch(wallpaperUrl(w.id)).then((r) => (r.ok ? r.blob() : undefined)).then((blob) => {
      if (blob === undefined) return;
      return tryDecode(blob).then((bmp) => {
        if (bmp === undefined) return;
        const accent = sampleAccentColor(bmp) || '';
        bmp.close();
        return fetch(wallpaperUrl(w.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accent, accentTouched: true })
        }).then((r) => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then((data) => {
          const cur = displayedWallpaper(settings);
          if (!cur || cur.id !== w.id || cur.accentTouched) return; // superseded by newer activity
          settings = adoptServerSettings(settings, data);
          cacheSettings(settings);
          applyAppearance(settings);
          syncPanel();
        });
      });
    }).catch(() => {});
  }

  /* ---- startup: the server is the source of truth; the local cache is the
     offline fallback. The page already painted with the cache above. Every
     page load re-rolls the random wallpaper of the active slot (the pick is
     per browser visit — never persisted). ---- */
  fetch('/api/appearance').then((r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then((data) => {
    const serverSettings = sanitizeSettings(data && data.settings);
    migrateGlobalPosition(serverSettings); // same one-time rule, server's copy
    settings = serverSettings;
    displayedId = null;
    rollSlot(settings); // fresh roll for this page visit
    applyAppearance(settings);
    syncPanel();
    cacheSettings(settings);
    migrateLegacy(serverSettings);
    maybeSampleAccent(serverSettings);
  }).catch(() => {
    /* server unreachable: keep the cached appearance, changes will sync once
       the network returns (the next PUT retries on any edit) */
    settings = readSettings();
    migrateGlobalPosition(settings); // same one-time rule, cached copy
    displayedId = null;
    rollSlot(settings); // fresh roll for this page visit
    applyAppearance(settings);
    syncPanel();
  });
})();
</script>
</body>
</html>
